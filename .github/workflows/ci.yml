name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust Core & CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy (core & cli)
        run: cargo clippy -p blockhost-core -p blockhost-cli --all-targets -- -D warnings
      - name: Test (core & cli)
        run: cargo test -p blockhost-core -p blockhost-cli

  frontend:
    name: Desktop Frontend (Svelte + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  desktop-tauri:
    name: Desktop Tauri Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: blockhost-desktop.exe
            artifact: BlockHost-desktop-windows
          - os: ubuntu-latest
            bin: blockhost-desktop
            artifact: BlockHost-desktop-linux
          - os: macos-latest
            bin: blockhost-desktop
            artifact: BlockHost-desktop-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (desktop)
        run: cargo clippy -p blockhost-desktop --all-targets --features custom-protocol -- -D warnings
      - name: Build desktop shell (embedded UI)
        run: cargo build -p blockhost-desktop --release --features custom-protocol
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}

  powershell-stopgap:
    name: PowerShell Stopgap Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run panel.ps1 tests
        run: |
          chmod +x tests/run-tests.sh
          PWSH=$(which pwsh) tests/run-tests.sh

  live-api-smoke:
    name: Live Upstream API Contract (Windows)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Paper Fill v3, Adoptium, and Modrinth contracts
        run: cargo test -p blockhost-core --test live_api -- --ignored --nocapture
